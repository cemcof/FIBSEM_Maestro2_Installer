[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fibsem-maestro-installer"
description = "Installer for FIBSEM Maestro 2"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "packaging>=26.3",
    "tomli-w>=1.2.0",
    "pyqt6>=6.12.0",
    "pywin32>=312; sys_platform == 'win32'",
    "qdarkstyle>=3.2.3",
]
dynamic = ["version"]

[tool.setuptools_scm]
write_to = "src/fibsem_maestro_installer/_version.py"

[tool.setuptools]
package-dir = { "" = "src" }

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pre-commit>=4.7.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[tool.ruff.lint]
extend-select = [
    "F",   # Pyflakes rules
    "W",   # PyCodeStyle warnings
    "E",   # PyCodeStyle errors
    "I",   # Sort imports properly
    "UP",  # Warn if certain things can changed due to newer Python versions
    "C4",  # Catch incorrect use of comprehensions, dict, list, etc
    "FA",  # Enforce from __future__ import annotations
    "ISC", # Good use of string concatenation
    "ICN", # Use common import conventions
    "RET", # Good return practices
    "SIM", # Common simplification rules
    "TID", # Some good import practices
    "TC",  # Enforce importing certain types in a TYPE_CHECKING block
    "PTH", # Use pathlib instead of os.path
    "NPY", # Some numpy-specific things
    "ARG", # Catch incorrect use of arguments
]

[tool.ty.analysis]
# pywin32 is installed on Windows only
allowed-unresolved-imports = ["win32com.**"]
