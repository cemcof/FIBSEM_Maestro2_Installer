name: Build installer

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            binary: dist/fibsem-maestro-installer
            artifact: fibsem-maestro-installer-linux-x86_64
          - os: windows-latest
            binary: dist/fibsem-maestro-installer.exe
            artifact: fibsem-maestro-installer-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Qt's xcb platform plugin needs these at run time; they are installed
      # here so PyInstaller bundles them into the installer, which then also
      # starts on machines that lack them
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 xvfb \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build the single-file executable
        run: uv run pyinstaller --noconfirm --clean fibsem-maestro-installer.spec

      # still running after 15 s (timeout's exit code 124) means the window came
      # up; a missing Qt dependency aborts right away
      - name: Check that the installer starts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          timeout 15 xvfb-run -a "${{ matrix.binary }}"
          test $? -eq 124

      - name: Name the artifact
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}
