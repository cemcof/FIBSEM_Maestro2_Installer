name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or pull request cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Qt without a display (the tests render icons)
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools-scm derives the version from the git tags
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # Python version from .python-version
      - name: Install the project and the dev tools
        run: uv sync --locked --group dev

      - name: Check that the pinned uv offers the pinned Python
        if: runner.os == 'Linux'
        run: |
          read -r UV PY < <(uv run --quiet python -c "from fibsem_maestro_installer import paths, uv_tool; print(uv_tool.UV_VERSION, paths.PYTHON_VERSION)")
          curl -LsSf "https://github.com/astral-sh/uv/releases/download/$UV/uv-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          ./uv-x86_64-unknown-linux-gnu/uv python list --all-versions --only-downloads | grep -q "cpython-$PY-linux-x86_64-gnu"

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: ty
        run: uv run ty check .

      - name: pytest
        run: uv run pytest
